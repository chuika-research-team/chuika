apiVersion: v1
kind: Namespace
metadata:
  name: chuika
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chuika-config
  namespace: chuika
data:
  LOG_LEVEL: "${LOG_LEVEL}"
  POSTGRES_HOST: "chuika-postgresql"
  POSTGRES_PORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: chuika-secret
  namespace: chuika
stringData:
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_DB: "${POSTGRES_DB}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@chuika-postgresql:5432/${POSTGRES_DB}"