[project]
name = "ml"
version = "0.1.0"
description = "ml"
readme = "README.md"
authors = []
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "sqlalchemy>=2.1.8",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "fastapi>=0.163.1",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.0",
    "lefthook>=2.1.16",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ["alembic"]